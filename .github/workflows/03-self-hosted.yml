# Exercício 3 — Self-Hosted Runner
#
# O que é um self-hosted runner?
#   É uma máquina que você mesmo registra no GitHub para executar
#   os jobs da sua pipeline, em vez de usar a infraestrutura cloud do GitHub.
#   Você instala o agente do GitHub Actions na sua máquina local,
#   em um servidor corporativo, ou em qualquer outro ambiente.
#
# Por que este workflow PRECISA de self-hosted runner?
#   Os testes em local-app.spec.ts acessam http://localhost:3000.
#   Um runner cloud (ubuntu-latest) está em um datacenter remoto e
#   jamais conseguiria alcançar o localhost da sua máquina.
#   O self-hosted runner roda NA SUA MÁQUINA, que é a mesma onde
#   o webServer do Playwright sobe o app Express em localhost:3000.
#   Resultado: testes que falhariam no cloud funcionam no self-hosted.
#
# Quando faz sentido usar self-hosted runner na vida real?
#   ✅ Acesso a recursos internos: banco de dados, API interna, VPN corporativa
#   ✅ Hardware específico: dispositivos móveis físicos, GPUs, leitores especiais
#   ✅ Compliance: código não pode sair da rede da empresa (saúde, bancos, gov)
#   ✅ Cache persistente: node_modules e browsers mantidos entre builds
#      → um build que leva 5 min no cloud pode levar 30 seg no self-hosted
#   ✅ Testes de performance: máquina dedicada com banda de rede controlada
#
# Quando NÃO usar:
#   ❌ Você é responsável por manter a máquina (atualizações, segurança)
#   ❌ O estado da máquina pode acumular "sujeira" entre execuções
#   ❌ Para projetos open source (risco de execução de código malicioso)
#
# Outras plataformas com recurso equivalente:
#   Jenkins:      Agents/Nodes   (criado em 2004 — o conceito original)
#   GitLab CI:    Self-hosted GitLab Runner
#   Azure DevOps: Self-hosted Agent (organizado em pools)
#   CircleCI:     Self-hosted Runner
#   Bitbucket:    Bitbucket Runners

name: "03 - Self-Hosted Runner (App Interno)"

on:
  workflow_dispatch:

jobs:

  testes-app-local:
    name: Testes App Interno (localhost:3000)
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Node.js e browsers já estão instalados na máquina do self-hosted runner
      # Não é necessário baixar o runtime como nos cloud runners
      - name: Instalar dependências
        run: npm ci

      # sem --with-deps pois as dependências de sistema já estão na máquina
      - name: Instalar browsers do Playwright
        run: npx playwright install chromium

      # playwright.local.config.ts tem webServer que sobe o app em localhost:3000
      # automaticamente antes dos testes e derruba ao terminar
      - name: Executar todos os testes (API pública + App interno)
        run: npm run test:local

      # allure-commandline requer Java — JAVA_HOME aponta para jdk-23
      - name: Gerar Allure Report
        if: always()
        shell: powershell
        run: |
          $env:JAVA_HOME = "C:\Program Files\Java\jdk-23"
          npm run allure:generate

      - name: Upload relatório HTML do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-self-hosted-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-self-hosted-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
